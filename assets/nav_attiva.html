<script>
// 1. Segna come attiva la voce di tendina della pagina corrente e il suo gruppo padre
//    (Quarto lo fa solo per le voci di primo livello). Lo stile e' in assets/styles/custom.css
// 2. Copia la tendina del gruppo in cima al sommario di sinistra ("nav-gruppo"),
//    cosi' le pagine sorelle si vedono senza aprire il menu (2026-09-26)
var tendina = null;
document.querySelectorAll(".navbar .dropdown-item").forEach(function (a) {
  if (a.pathname === window.location.pathname) {
    a.classList.add("active");
    tendina = a.closest(".dropdown");
    var gruppo = tendina.querySelector(".dropdown-toggle");
    if (gruppo) gruppo.classList.add("active");
  }
});

var toc = document.querySelector("#quarto-sidebar #TOC");
if (tendina && toc) {
  var blocco = document.createElement("nav");
  blocco.className = "nav-gruppo";
  var titolo = document.createElement("h2");
  titolo.textContent = tendina.querySelector(".dropdown-toggle").textContent.trim();
  blocco.appendChild(titolo);
  var lista = document.createElement("ul");
  tendina.querySelectorAll(".dropdown-item").forEach(function (a) {
    var li = document.createElement("li");
    if (a.classList.contains("active")) {
      li.textContent = a.textContent.trim();   // pagina corrente: testo, non link
      li.className = "active";
    } else {
      var link = document.createElement("a");
      link.href = a.href;
      link.textContent = a.textContent.trim();
      li.appendChild(link);
    }
    lista.appendChild(li);
  });
  blocco.appendChild(lista);
  toc.parentNode.insertBefore(blocco, toc);
}
</script>
