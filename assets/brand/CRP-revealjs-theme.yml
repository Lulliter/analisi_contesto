format:
  revealjs:
    # Path relativi al .qmd che include questo file di metadata
    # (es. <cartella>/<tema>/slides.qmd → ../../assets/brand/...)
    theme: [default, ../../assets/brand/CRP-revealjs.scss]
    logo: ../../assets/brand/logo.jpg
    footer: "Fondazione Cariparma - Osservatorio Dati Sociali | {{< meta date >}}"
    slide-number: true
    show-slide-number: all
    transition: fade
    background-transition: fade
    self-contained: true
